name: peakpin
description: "PeakPin"
publish_to: 'none'

version: 1.0.1+12

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.0
  google_fonts: ^6.3.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.3
  # Düzəliş Prompt 4 / INFRA-40 — Android Keystore/iOS Keychain-backed
  # storage for ONLY the two most sensitive locally-cached profile
  # fields (email, birthDate); everything else stays in
  # shared_preferences (see ProfileController's own doc comment).
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  # Was already resolved transitively (pulled in by the dev-only
  # flutter_launcher_icons tool) — promoted to a direct dependency
  # (Düzəliş Prompt 3 / C#43) rather than relying on that implicitly,
  # since a flutter_launcher_icons version bump could otherwise change
  # or drop it without warning. Used for EXIF stripping (decode→encode
  # drops EXIF by default) — see lib/core/utils/exif_stripper.dart.
  image: ^4.9.1
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.5
  cloud_functions: ^5.1.5
  permission_handler: ^11.3.1
  intl: ^0.20.2
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  visibility_detector: ^0.4.0+2
  record: ^6.1.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  package_info_plus: ^8.1.1
  device_info_plus: ^11.2.0
  firebase_messaging: ^15.1.5
  firebase_app_check: ^0.3.1
  firebase_remote_config: ^5.1.5
  firebase_analytics: ^11.3.5
  firebase_crashlytics: ^4.1.5
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.3
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0
  in_app_purchase: ^3.2.0
  share_plus: ^10.1.4
  app_links: ^6.4.0
  flutter_branch_sdk: ^9.3.3
  flutter_slidable: ^3.1.1
  geocoding: ^3.0.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  image_cropper: ^8.0.0
  geoflutterfire_plus: ^0.0.31
  http: ^1.2.2
  gal: ^2.3.0
  wakelock_plus: ^1.2.10
  flutter_webrtc: ^0.12.6
  webrtc_interface: ^1.5.1
  qr_flutter: ^4.1.0

dependency_overrides:
  # pub.dev's video_thumbnail 0.5.6 (the latest published version) still
  # ships an Android build.gradle pointing at jcenter(), which was shut
  # down and no longer exists as a valid Gradle repository method under
  # Gradle 9 — the upstream package has no fix. Patched local copy in
  # packages/video_thumbnail/ (jcenter() -> mavenCentral(), otherwise
  # identical) instead of waiting on an abandoned dependency.
  video_thumbnail:
    path: packages/video_thumbnail

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.1

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  # Used directly in test/core/utils/exif_stripper_test.dart to fake
  # path_provider's platform channel (no real filesystem/plugin
  # registration available under `flutter test`) — was already resolved
  # transitively via path_provider itself, promoted to a direct
  # dev dependency since a test imports it by name.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon.png
    - assets/icon_foreground.png
    - assets/sounds/ringback.wav

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#E8F8F9"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true