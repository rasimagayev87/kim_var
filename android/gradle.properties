# Previous heap caps here (Xmx1024M, workers.max=1, daemon=false) were based on a
# wrong "this machine has 4GB RAM" assumption — it's actually a 16GB MacBook Air M5.
# The undersized heap was itself causing the GC-thrashing build failures on release
# builds (R8/minification is memory-hungry), not fixing them. Raised to sane defaults
# for the real hardware; re-enabled the daemon and parallel workers for build speed.
org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024m
org.gradle.daemon=true
org.gradle.workers.max=4
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx1536m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
