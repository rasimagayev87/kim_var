# MaxMetaspaceSize bumped 256m -> 512m: with kotlin.compiler.execution.strategy=in-process
# below, Kotlin compilation shares THIS JVM's metaspace rather than a separate daemon's —
# so as the plugin count grew this session (cloud_functions, device_info_plus,
# package_info_plus, firebase_messaging, url_launcher — each applying its own Kotlin
# Gradle Plugin instance), 256m started overflowing with "OutOfMemoryError: Metaspace".
org.gradle.jvmargs=-Xmx1024M -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
# This machine has 4GB RAM total — parallel workers each spawn their own
# JVM/compiler process, which is what was pushing the system past its
# limit and crashing the Dart VM's own thread creation ("Could not start
# thread DartWorker") during the same build. Capping to 1 trades build
# speed for actually completing.
org.gradle.workers.max=1
# The Kotlin compiler's own daemon is a SEPARATE JVM process from the
# Gradle daemon above (org.gradle.daemon=false doesn't touch it) — on
# this machine's 4GB RAM it was dying silently on startup (exit 0, no
# output) before it could even report readiness. Forcing in-process
# compilation skips spawning that extra daemon entirely, and capping
# its heap covers the case where a daemon does still get used.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvm.options=-Xmx768m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
